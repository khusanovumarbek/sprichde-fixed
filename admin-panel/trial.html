<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>SprichDe · Sinov darsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="SprichDe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SprichDe">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;--blue:var(--primary);--blue-dark:var(--primary-2);--muted:#788196;--line:#e9ebf2;--shadow:0 10px 26px #1d2b4b0f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;text-decoration:none;color:var(--text)}
.topbar b{font-size:16px;font-weight:800}
.center{flex:1;display:grid;place-items:center;padding:30px}
.box{text-align:center;max-width:360px}
.e-icon{width:92px;height:92px;border-radius:28px;background:#fde8bd;display:grid;place-items:center;margin:0 auto 22px;font-size:42px}
html[data-theme="dark"] .e-icon{background:#3c3218}
.box h2{margin:0 0 8px;font-size:20px;font-weight:800}
.box p{margin:0 0 22px;font-size:13px;color:var(--muted);line-height:1.65}
.cta{display:inline-block;border:0;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:14px 26px;border-radius:15px;text-decoration:none;cursor:pointer;box-shadow:var(--shadow)}
.cta:hover{background:var(--blue-dark)}
.cta:disabled{opacity:.65;cursor:progress}
.hint{margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="app.html">‹</a>
  <b>Sinov darsi</b>
</header>

<div class="center">
  <div class="box">
    <div class="e-icon">🎬</div>
    <h2>Sinov darsi</h2>
    <p>Bu — bepul tanishtiruv darsi.<br>Sinov darsi sahifasi tayyorlanmoqda.</p>
    <a class="cta" href="app.html" id="doneBtn">1-darsni o‘tildi deb belgilash ✓</a>
    <div class="hint">Belgilangach, 91 kunlik sayohatda 1-dars o‘tilgan bo‘ladi.</div>
  </div>
</div>

<script>
(async function initTrial() {
  const me = await guard('student');
  if (!me) return;

  const btn = document.getElementById('doneBtn');
  const hint = document.querySelector('.hint');

  // Agar 1-kun allaqachon o'tilgan bo'lsa, qayta belgilash shart emas.
  try {
    const progress = await authFetch('/api/progress');
    if (Array.isArray(progress.completedDays) && progress.completedDays.includes(1)) {
      btn.textContent = '1-dars o‘tilgan ✓';
      btn.classList.add('done');
      hint.textContent = 'Sayohatni davom ettirish uchun kabinetga qayting.';
    }
  } catch {}

  btn.addEventListener('click', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Belgilanmoqda…';
    try {
      await authFetch('/api/progress/complete', {
        method: 'POST',
        body: JSON.stringify({ day: 1 }),
      });
      btn.textContent = '1-dars o‘tilgan ✓';
      hint.textContent = 'Sayohatni davom ettirish uchun kabinetga qayting.';
      location.href = 'app.html';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '1-darsni o‘tildi deb belgilash ✓';
      alert(err.message);
    }
  });
})();
</script>
</body>
</html>
